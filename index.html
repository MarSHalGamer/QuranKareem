<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quran Kareem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100vh; overflow: hidden; display: flex;
            align-items: center; justify-content: center; font-family: 'Amiri', serif;
            background: radial-gradient(circle at center, #2e0104 0%, #1a0002 100%);
        }
        .player-card {
            background: rgba(30, 1, 4, 0.98); border-radius: 25px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9); padding: 35px 25px;
            text-align: center; width: 90%; max-width: 400px; position: relative;
            border: 3px solid #d4af37;
        }
        .main-title {
            font-family: 'Montserrat', sans-serif; font-size: 34px; font-weight: 800;
            letter-spacing: 2px; color: #ffd700; margin-bottom: 2px;
        }
        .sub-title { font-family: 'Amiri', serif; font-size: 13px; color: #d1b168; margin-bottom: 25px; }
        #selectionView { display: flex; flex-direction: column; gap: 15px; }
        .header-box {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(184, 134, 11, 0.4));
            border: 1.5px solid #ffd700; color: #ffd700; padding: 12px;
            border-radius: 12px; font-size: 20px; font-weight: 700; pointer-events: none;
        }
        .surah-select-btn {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); color: #1a0002;
            border: none; padding: 15px; font-size: 22px; font-family: 'Amiri', serif;
            font-weight: 700; border-radius: 15px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(184, 134, 11, 0.4);
        }
        #playerView { display: none; }
        .surah-badge {
            font-family: 'Amiri', serif; font-size: 28px; font-weight: 700; color: #ffffff;
            background: rgba(212, 175, 55, 0.2); border-top: 2px solid #ffd700;
            border-bottom: 2px solid #ffd700; padding: 6px 0; margin-bottom: 25px; border-radius: 10px;
        }
        .progress-container { margin-bottom: 25px; }
        .slider {
            -webkit-appearance: none; width: 100%; height: 6px; border-radius: 5px;
            background: #4a0d15; outline: none;
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: #ffd700; cursor: pointer;
        }
        .time-display {
            display: flex; justify-content: space-between; font-size: 13px;
            color: #d1b168; margin-top: 8px; direction: ltr;
        }
        .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn {
            background: linear-gradient(135deg, #ffd700 0%, #b8860b 100%); color: #1a0002;
            border: none; padding: 14px 8px; font-size: 15px; font-family: 'Amiri', serif;
            font-weight: 700; border-radius: 12px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-full { grid-column: span 2; }
        .back-btn {
            background: transparent; border: 1px solid #d4af37; color: #d1b168;
            padding: 8px 15px; border-radius: 8px; font-size: 14px; cursor: pointer;
            margin-top: 15px; font-family: 'Amiri', serif;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h1 class="main-title">QURAN KAREEM</h1>
        <div class="sub-title">صنع بـ عبدالقادر</div>

        <!-- واجهة اختيار السورة -->
        <div id="selectionView">
            <div class="header-box">اختر سورة</div>
            <button class="surah-select-btn" onclick="openSurah('سورة ص', '038.mp3')">سورة ص</button>
            <button class="surah-select-btn" onclick="openSurah('سورة الزمر', '039.mp3')">سورة الزمر</button>
        </div>

        <!-- واجهة المشغل -->
        <div id="playerView">
            <div class="surah-badge" id="currentSurahTitle">سورة الزمر</div>
            <audio id="quranAudio" src=""></audio>

            <div class="progress-container">
                <input type="range" id="seekSlider" class="slider" value="0" min="0" max="100">
                <div class="time-display">
                    <span id="currentTime">00:00</span>
                    <span id="durationTime">00:00</span>
                </div>
            </div>

            <div class="controls-grid">
                <button class="btn" onclick="playAudio()"><i class="fa-solid fa-play"></i> تشغيل</button>
                <button class="btn" onclick="pauseAudio()"><i class="fa-solid fa-pause"></i> إيقاف مؤقت</button>
                <button class="btn" onclick="rewind10()"><i class="fa-solid fa-rotate-left"></i> الرجوع 10 ثواني</button>
                <button class="btn" onclick="forward10()"><i class="fa-solid fa-rotate-right"></i> التقدم 10 ثواني</button>
                <button class="btn btn-full" onclick="restartAudio()"><i class="fa-solid fa-arrows-rotate"></i> إعادة من البداية</button>
            </div>

            <button class="back-btn" onclick="goBackToSelection()"><i class="fa-solid fa-arrow-right"></i> اختيار سورة أخرى</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚙️ إعدادات JSONBin (تم دمج بياناتك هنا)
        // ==========================================
        const BIN_ID = '6a919e09da38895dfe1c93cb';
        const MASTER_KEY = '$2a$10$EVJpa1kkUQx4JG6CPhwT8eMpLADFaWQc7iR5SShpZRDJSGC2sThvi';

        // دالة لتسجيل دخول الزائر
        async function logVisitor() {
            try {
                // 1. توليد رقم زائر مميز عشوائي
                const visitorId = 'زائر_' + Math.random().toString(36).substring(2, 10).toUpperCase();
                const timestamp = new Date().toLocaleString('ar-SA');

                // 2. جلب البيانات الحالية من JSONBin
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    method: 'GET',
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                
                let data = await response.json();
                let visitsArray = [];
                
                // التأكد من أن البيانات عبارة عن مصفوفة (Array) لتجنب الأخطاء
                if (data.record && Array.isArray(data.record)) {
                    visitsArray = data.record;
                } else if (data.record && data.record.visits && Array.isArray(data.record.visits)) {
                    visitsArray = data.record.visits;
                }

                // 3. إضافة سجل الدخول الجديد
                visitsArray.push({
                    message: "تم دخول الموقع",
                    visitor_id: visitorId,
                    time: timestamp
                });

                // 4. حفظ البيانات المحدثة في JSONBin
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ visits: visitsArray })
                });
                
                console.log("✅ تم تسجيل دخول الزائر بنجاح: " + visitorId);
            } catch (error) {
                console.error("❌ فشل في تسجيل الدخول:", error);
            }
        }

        // تشغيل دالة التسجيل فور فتح الموقع
        window.addEventListener('DOMContentLoaded', logVisitor);

        // ==========================================
        // 🎵 أكواد مشغل الصوت (الأصلية)
        // ==========================================
        const audio = document.getElementById('quranAudio');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeElem = document.getElementById('currentTime');
        const durationTimeElem = document.getElementById('durationTime');
        const selectionView = document.getElementById('selectionView');
        const playerView = document.getElementById('playerView');
        const currentSurahTitle = document.getElementById('currentSurahTitle');

        function openSurah(title, audioFile) {
            currentSurahTitle.textContent = title;
            audio.src = audioFile;
            selectionView.style.display = 'none';
            playerView.style.display = 'block';
            audio.play();
        }

        function goBackToSelection() {
            audio.pause();
            audio.currentTime = 0;
            playerView.style.display = 'none';
            selectionView.style.display = 'flex';
        }

        function playAudio() { audio.play(); }
        function pauseAudio() { audio.pause(); }
        function restartAudio() { audio.currentTime = 0; audio.play(); }
        function forward10() { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); }
        function rewind10() { audio.currentTime = Math.max(0, audio.currentTime - 10); }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                seekSlider.value = (audio.currentTime / audio.duration) * 100;
                currentTimeElem.textContent = formatTime(audio.currentTime);
                durationTimeElem.textContent = formatTime(audio.duration);
            }
        });

        seekSlider.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekSlider.value / 100) * audio.duration;
            }
        });
    </script>
</body>
</html>
