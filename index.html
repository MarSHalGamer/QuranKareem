<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quran Kareem</title>
    <link rel="preconnect" href="[https://fonts.googleapis.com](https://fonts.googleapis.com)">
    <link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
    <link href="[https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cinzel:wght@800&family=Tajawal:wght@500;700&display=swap](https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cinzel:wght@800&family=Tajawal:wght@500;700&display=swap)" rel="stylesheet">
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css)">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* منع التمرير والتحريك نهائياً فوق وتحت */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #1e0005;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Tajawal', sans-serif;
        }

        .player-card {
            background: rgba(40, 2, 8, 0.95);
            border: 2px solid #d4af37;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 25px 20px;
            text-align: center;
            width: 90%;
            max-width: 380px;
        }

        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 32px;
            font-weight: 800;
            color: #d4af37;
            margin-bottom: 2px;
        }

        .sub-title {
            font-size: 13px;
            color: #d1b168;
            margin-bottom: 18px;
        }

        .surah-badge {
            font-family: 'Amiri', serif;
            font-size: 24px;
            color: #ffffff;
            background: rgba(212, 175, 55, 0.15);
            border-top: 1px solid #d4af37;
            border-bottom: 1px solid #d4af37;
            padding: 4px 0;
            margin-bottom: 20px;
        }

        .progress-container {
            margin-bottom: 20px;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 5px;
            border-radius: 5px;
            background: #4a0d15;
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #d4af37;
            cursor: pointer;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #d1b168;
            margin-top: 6px;
            direction: ltr;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            background: #3b040b;
            color: #f7e7a9;
            border: 1px solid #d4af37;
            padding: 12px 5px;
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            background: #d4af37;
            color: #1a0003;
        }

        .btn-full {
            grid-column: span 2;
        }
    </style>
</head>
<body>

    <div class="player-card">
        <h1 class="main-title">QURAN KAREEM</h1>
        <div class="sub-title">صنع ب عبدالقادر</div>

        <div class="surah-badge">سورة الزمر</div>

        <audio id="quranAudio" src="039.mp3"></audio>

        <div class="progress-container">
            <input type="range" id="seekSlider" class="slider" value="0" min="0" max="100">
            <div class="time-display">
                <span id="currentTime">00:00</span>
                <span id="durationTime">00:00</span>
            </div>
        </div>

        <div class="controls-grid">
            <button class="btn" onclick="playAudio()">
                <i class="fa-solid fa-play"></i> تشغيل
            </button>
            
            <button class="btn" onclick="pauseAudio()">
                <i class="fa-solid fa-pause"></i> إيقاف مؤقت
            </button>

            <button class="btn" onclick="rewind10()">
                <i class="fa-solid fa-rotate-left"></i> الرجوع 10 ثواني
            </button>

            <button class="btn" onclick="forward10()">
                <i class="fa-solid fa-rotate-right"></i> التقدم 10 ثواني
            </button>

            <button class="btn btn-full" onclick="restartAudio()">
                <i class="fa-solid fa-arrows-rotate"></i> إعادة من البداية
            </button>
        </div>
    </div>

    <script>
        const audio = document.getElementById('quranAudio');
        const seekSlider = document.getElementById('seekSlider');
        const currentTimeElem = document.getElementById('currentTime');
        const durationTimeElem = document.getElementById('durationTime');

        function playAudio() { audio.play(); }
        function pauseAudio() { audio.pause(); }
        function restartAudio() { audio.currentTime = 0; audio.play(); }
        function forward10() { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); }
        function rewind10() { audio.currentTime = Math.max(0, audio.currentTime - 10); }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                seekSlider.value = (audio.currentTime / audio.duration) * 100;
                currentTimeElem.textContent = formatTime(audio.currentTime);
                durationTimeElem.textContent = formatTime(audio.duration);
            }
        });

        seekSlider.addEventListener('input', () => {
            if (audio.duration) {
                audio.currentTime = (seekSlider.value / 100) * audio.duration;
            }
        });
    </script>

</body>
</html>
